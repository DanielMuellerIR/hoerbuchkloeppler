<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33363E"/><stop offset="1" stop-color="#1E2026"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C08A50"/><stop offset="1" stop-color="#8F5F30"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="50" y="50" width="412" height="412" rx="92" fill="url(#bg)"/>
  </g>
  <rect x="50.5" y="50.5" width="411" height="411" rx="91.5" fill="none" stroke="rgba(255,255,255,0.08)"/>
  <!-- gekreuzte Klöppel hinter dem Play-Button -->
  <g transform="translate(256,256) rotate(40)">
    <circle cy="-138" r="22" fill="#8F5F30"/>
    <rect x="-8" y="-122" width="16" height="18" fill="#8F5F30"/>
    <rect x="-12" y="-104" width="24" height="252" rx="12" fill="#8F5F30"/>
  </g>
  <g transform="translate(256,256) rotate(-40)">
    <circle cy="-138" r="22" fill="url(#wood)"/>
    <rect x="-8" y="-122" width="16" height="18" fill="url(#wood)"/>
    <rect x="-12" y="-104" width="24" height="252" rx="12" fill="url(#wood)"/>
  </g>
  <!-- Play-Button -->
  <circle cx="256" cy="256" r="90" fill="#F2E7D5"/>
  <path d="M234,215 L312,256 L234,297 Z" fill="#2B2D34" stroke="#2B2D34" stroke-width="16" stroke-linejoin="round"/>
</svg>
